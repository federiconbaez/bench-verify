[package]
name = "bench-verify"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
description = "Re-run a benchmark claim N times, compute median + bootstrap CI, PASS/FAIL against a TOML threshold"
repository = "https://github.com/federiconbaez/bench-verify"
readme = "README.md"
keywords = ["benchmark", "verification", "ci", "bootstrap", "toml"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "bench-verify"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "1"
regex = "1"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"
